<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Hà Quang Minh Đức 🇻🇳</title>
    <link rel="icon" href="icon.jpeg" type="image/jpeg">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
                        mono: ['"Space Grotesk"', 'monospace'],
                    }
                }
            }
        }
    </script>

    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>

<body class="h-screen h-[100dvh] w-screen overflow-hidden flex items-center justify-center p-3 sm:p-5 text-slate-100 relative selection:bg-indigo-500 selection:text-white">

    <!-- Noise Texture & Dynamic RGB Ambient Lighting -->
    <div class="noise-bg"></div>
    
    <!-- Floating Star Dust Canvas -->
    <canvas id="stars-canvas" class="fixed inset-0 pointer-events-none z-[1]"></canvas>
    
    <div class="rgb-orb-1" id="glow-1"></div>
    <div class="rgb-orb-2" id="glow-2"></div>
    <div class="rgb-orb-3" id="glow-3"></div>

    <!-- Background Audio Element -->
    <audio id="bg-audio" loop preload="auto" src="nhacnen.mp3"></audio>

    <!-- Main Container: Guaranteed to fit in 100dvh without vertical scroll -->
    <main class="relative z-10 w-full max-w-md mx-auto flex flex-col justify-center max-h-[100dvh] py-1">

        <!-- Top Bar: Live Clock & Realtime Weather Indicator -->
        <div class="flex items-center justify-between px-2 mb-2 sm:mb-3">
            <div class="flex items-center gap-1.5 text-[10px] sm:text-[11px] font-mono text-slate-400">
                <span class="inline-block w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                <span>VIETNAM <span id="live-clock" class="text-slate-200 font-semibold tracking-wider">--:--:--</span></span>
                <span class="text-slate-600 font-sans">•</span>
                <span id="weather-display" class="inline-flex items-center gap-1 text-slate-300" title="Thời tiết thời gian thực tại Nghệ An">
                    <i id="weather-icon" class="fa-solid fa-cloud-sun text-amber-300 text-[10px]"></i>
                    <span id="weather-temp" class="font-semibold text-slate-200">--°C</span>
                </span>
            </div>

            <!-- Decorative Theme Color Dots (Trang trí phong cách Mac/UI) -->
            <div class="flex items-center gap-1.5 py-1 px-2.5 rounded-full glass-pill" title="RGB Aura Palette">
                <span class="w-2.5 h-2.5 rounded-full bg-rose-500 shadow-[0_0_8px_rgba(244,63,94,0.6)] animate-pulse"></span>
                <span class="w-2.5 h-2.5 rounded-full bg-amber-400 shadow-[0_0_8px_rgba(251,191,36,0.6)]"></span>
                <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 shadow-[0_0_8px_rgba(52,211,153,0.6)]"></span>
                <span class="w-2.5 h-2.5 rounded-full bg-indigo-500 shadow-[0_0_8px_rgba(99,102,241,0.6)]"></span>
            </div>
        </div>

        <!-- Sleek Profile Card -->
        <div id="card-element" class="tilt-box glass-card rounded-[2rem] sm:rounded-[2.25rem] p-4 sm:p-7 relative overflow-hidden">

            <!-- Subtle Card Top RGB Highlight -->
            <div class="absolute top-0 left-1/2 -translate-x-1/2 w-48 h-[1.5px] bg-gradient-to-r from-transparent via-indigo-400/60 to-transparent"></div>

            <!-- Header Profile Area -->
            <div class="flex items-center gap-4 text-left">
                
                <!-- Avatar with Blue Frame & Blue Verified Badge -->
                <div class="relative shrink-0 group">
                    <div class="relative w-16 h-16 sm:w-20 sm:h-20 rounded-2xl overflow-hidden p-[2.5px] bg-gradient-to-tr from-blue-600 via-blue-500 to-sky-400 shadow-xl shadow-blue-500/25">
                        <img src="avt.jpg" alt="Hà Quang Minh Đức" class="w-full h-full object-cover rounded-[14px]">
                    </div>
                    <!-- Verified Status Badge (Blue) -->
                    <div class="absolute -bottom-1 -right-1 bg-[#06080e] p-0.5 rounded-full border border-white/10 shadow-lg flex items-center justify-center">
                        <div class="w-4 h-4 rounded-full bg-gradient-to-tr from-blue-600 to-sky-400 flex items-center justify-center text-white text-[8px] shadow-[0_0_8px_rgba(56,189,248,0.7)]">
                            <i class="fa-solid fa-check"></i>
                        </div>
                    </div>
                </div>

                <!-- Name & Bio Title -->
                <div class="flex-1 min-w-0">
                    <h1 class="text-lg sm:text-2xl font-extrabold tracking-tight text-white truncate">
                        Hà Quang Minh Đức
                    </h1>

                    <p class="text-[11px] sm:text-xs text-sky-400/90 font-mono">
                        @haquangminhduc
                    </p>

                    <!-- Typewriter Text Quote -->
                    <div class="mt-1 flex items-center gap-1 min-h-[1.2rem] text-[10px] sm:text-[11px] text-slate-300">
                        <i class="fa-solid fa-quote-left text-[8px] text-indigo-400/70 shrink-0"></i>
                        <span id="typewriter-text" class="italic tracking-tight text-slate-200"></span><span class="inline-block w-[1.5px] h-3 bg-sky-400 animate-pulse"></span>
                    </div>
                </div>

            </div>

            <!-- Essential Info Grid (Full Name, Date of Birth, Hometown) -->
            <div class="mt-4 sm:mt-5 space-y-2 sm:space-y-3">

                <!-- 1. Full Name -->
                <div class="glass-pill rounded-xl sm:rounded-2xl p-2.5 sm:p-3.5 flex items-center justify-between group">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 sm:w-9 sm:h-9 rounded-lg sm:rounded-xl bg-white/5 flex items-center justify-center text-slate-300 group-hover:text-blue-400 group-hover:bg-white/10 transition">
                            <i class="fa-solid fa-user text-xs sm:text-sm"></i>
                        </div>
                        <div>
                            <div class="text-[9px] sm:text-[10px] font-mono uppercase tracking-wider text-slate-400">Full Name</div>
                            <div class="text-xs sm:text-sm font-semibold text-slate-100">Ha Quang Minh Duc</div>
                        </div>
                    </div>
                </div>

                <!-- 2. Date of Birth -->
                <div class="glass-pill rounded-xl sm:rounded-2xl p-2.5 sm:p-3.5 flex items-center justify-between group">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 sm:w-9 sm:h-9 rounded-lg sm:rounded-xl bg-white/5 flex items-center justify-center text-slate-300 group-hover:text-amber-400 group-hover:bg-white/10 transition">
                            <i class="fa-solid fa-cake-candles text-xs sm:text-sm"></i>
                        </div>
                        <div>
                            <div class="text-[9px] sm:text-[10px] font-mono uppercase tracking-wider text-slate-400">Date of Birth</div>
                            <div class="text-xs sm:text-sm font-semibold text-slate-100">07/05/2004</div>
                        </div>
                    </div>
                </div>

                <!-- 3. Hometown -->
                <div class="glass-pill rounded-xl sm:rounded-2xl p-2.5 sm:p-3.5 flex items-center justify-between group">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 sm:w-9 sm:h-9 rounded-lg sm:rounded-xl bg-white/5 flex items-center justify-center text-slate-300 group-hover:text-emerald-400 group-hover:bg-white/10 transition">
                            <i class="fa-solid fa-location-dot text-xs sm:text-sm"></i>
                        </div>
                        <div>
                            <div class="text-[9px] sm:text-[10px] font-mono uppercase tracking-wider text-slate-400">Hometown / Location</div>
                            <div class="text-xs sm:text-sm font-semibold text-slate-100">Nghe An, Vietnam 🇻🇳</div>
                        </div>
                    </div>
                </div>

            </div>

            <!-- Quick Action / Social Connect Dock -->
            <div class="mt-4 sm:mt-5 pt-3 sm:pt-4 border-t border-white/10 flex items-center justify-between gap-2 sm:gap-3">
                
                <!-- GitHub Link -->
                <a href="https://github.com/haquangminhduc" target="_blank" rel="noopener noreferrer" class="flex-1 glass-pill py-2.5 px-2 sm:py-3 sm:px-3 rounded-xl sm:rounded-2xl flex items-center justify-center gap-1.5 text-xs font-medium text-slate-200 hover:text-white transition group">
                    <i class="fa-brands fa-github text-xs sm:text-sm group-hover:scale-110 transition-transform"></i>
                    <span class="font-mono text-[11px] sm:text-xs">GitHub</span>
                </a>

                <!-- Facebook Link -->
                <a href="https://facebook.com" target="_blank" rel="noopener noreferrer" class="flex-1 glass-pill py-2.5 px-2 sm:py-3 sm:px-3 rounded-xl sm:rounded-2xl flex items-center justify-center gap-1.5 text-xs font-medium text-slate-200 hover:text-white transition group">
                    <i class="fa-brands fa-facebook-f text-xs sm:text-sm text-blue-400 group-hover:scale-110 transition-transform"></i>
                    <span class="font-mono text-[11px] sm:text-xs">Facebook</span>
                </a>

                <!-- Copy Email Quick Button -->
                <button onclick="copyEmail('haquangminhduc@gmail.com')" id="copy-btn" class="flex-1 glass-pill py-2.5 px-2 sm:py-3 sm:px-3 rounded-xl sm:rounded-2xl flex items-center justify-center gap-1.5 text-xs font-medium text-slate-200 hover:text-white transition group">
                    <i class="fa-solid fa-envelope text-xs sm:text-sm text-rose-400 group-hover:scale-110 transition-transform"></i>
                    <span class="font-mono text-[11px] sm:text-xs" id="copy-text">Email</span>
                </button>

            </div>

        </div>

        <!-- Subtle Footer Signature -->
        <div class="mt-3 sm:mt-4 text-center text-[10px] sm:text-[11px] font-mono text-slate-500 tracking-wider">
            <span>Vibecoding • Hà Quang Minh Đức</span>
        </div>

    </main>

    <!-- Custom Scripts -->
    <script src="script.js"></script>
</body>
</html>
